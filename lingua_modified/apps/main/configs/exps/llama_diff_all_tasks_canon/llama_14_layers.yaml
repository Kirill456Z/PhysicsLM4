# Mixed synthetic task training configuration
# All five tasks (Depo, Brevo, ConComp, ConCompFactor, ShortestPath) share a unified vocabulary:
#   - base_vocab_size=4 (tokens 1..8 for node words)
#   - min/max_token_length=4/6 (each node name = 4-6 tokens)
#   - Task-type token replaces BOS (first token of every sequence)
#   - vocab_size=512 covers all tokens with ample headroom
#
# See data_synthetic_pretrain/shared_vocab.py for the full token layout.

name: "mix_{semver_tag}"
dump_dir: /scratch/zemlians/physics4lm/mix_checkpoints

steps: 80000
probe_freq: null
seed: 64
grad_acc_steps: 1
include_generators:
    - concomp_factor_edges_list
    - concomp_factor_adj_list
    - depo_edges_list
    - depo_adj_list
    - shortest_path_edges_list
    - shortest_path_adj_list
    - bfs_edges_list
    - bfs_adj_list

# Optimizer settings
optim:
    lr: 3e-4
    lr_min: 3e-6
    warmup: 1000
    lr_min_ratio: 0.1
    weight_decay: 0.03
    epsilon: 1.0e-06
    beta1: 0.9
    beta2: 0.98

# Distributed training settings
distributed:
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

# Model architecture (~86M params, iso-param to 768x12; dim/n_layers ratio=50.3)
# dim=704 chosen so total params ≈ 768x12 baseline (~89.1M, +4.0%)
model:
    seed: 54
    dim: 704
    n_layers: 14
    n_heads: 11
    head_dim: 64
    # Unified vocab layout (B=4):
    #   0: PAD  1-4: base tokens  5-8: EOW markers
    #   9: TASK_DEPO  10: TASK_BREVO  11: TASK_CONCOMP  12: EOS
    #   13-14: Brevo specials  15-16: ConComp specials  17: DEPO_SEP
    #   201-216: Depo hop tokens (200+k, k=1..16)
    #   512 gives ample headroom for all current and future tokens.
    vocab_size: 512

    rope_theta: 10000.0
    canon_set: "ABCD"
    use_fast_conv1d:  true
    canon_kernel: 4
    canon_init: default
    train_canon_weights: true
    canon_gamma: false
    canon_residual: true
    z_loss: false

# Data loading settings
data:
    root_dir: /scratch/zemlians/physics4lm
    eval_dump_dir: /scratch/zemlians/physics4lm/synthetic_eval
    sources:
        depo: 1.0

    batch_size: 128
    prefetch_size: 1024
    seq_len: 1024
    n_views: 2
    n_workers: 16
    pad_token: 0
    no_train_label_token: -100

    load_async: true
    seed: 43

    tokenizer:
        name: none

    add_bos: false
    add_eos: false

# Profiling settings
profiling:
    run: false

# Checkpoint settings
checkpoint:
    dump:
        every: 20000
        keep: 2
    eval:
        every: 4000
        keep: 2

# Logging settings
logging:
    freq: 10
    acc_freq: 10
    diagnostics_easy_freq: 300
    diagnostics_medium_freq: 5000
    diagnostics_heavy_freq: 0
    wandb:
        entity: kirill456z
        project: physics4llm
        name: "mix_{semver_tag}"

eval:
  name: "mixed_eval"
  dump_dir: /scratch/zemlians/physics4lm/mixed_eval
  generator:
    max_gen_len: 10
    show_progress: true
