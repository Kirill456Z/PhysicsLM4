# Canon Text Training Configuration
# Regular text training using standard lingua pipeline with canon convolution layers

name: "canon_text_{semver_tag}"
dump_dir: /scratch/zemlians/physics4lm/canon_text_checkpoints

steps: 100000
probe_freq: 1000
seed: 42

data_mode: text

grad_acc_steps: 1

# Optimizer settings
optim:
    lr: 1e-3
    warmup: 1000
    lr_min_ratio: 0.1
    weight_decay: 0.05
    epsilon: 1.0e-08
    beta1: 0.9
    beta2: 0.95

# Distributed training settings (no_shard for single-GPU: enables fused linear+CE)
distributed:
    fsdp_type: no_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

# Model architecture
model:
    seed: 44
    dim: 512
    n_layers: 8
    n_heads: 8
    head_dim: 64
    vocab_size: -1 
    
    rope_theta: 10000.0
    # Layer norm placement: "pre", "post", "peri", or "none" (no norms)
    layer_norm_type: pre
    # Scale MHA/MLP outputs by 1/sqrt(layer_idx) before adding to residual
    #residuals_scaling: true
    # Fuse linear+CE to avoid materializing full logits (saves ~6GB for GPT-2 vocab)
    fuse_cross_entropy: true
    canon_set: "AC"
    canon_layers: [0]  # Optional: list of layer indices for canon; if omitted, canon applied to all layers
    use_fast_conv1d: true
    canon_kernel: 4
    canon_init: default
    weight_tying: true

# Data loading settings (uses *.chunk.*.jsonl files)
data:
    root_dir: /scratch/zemlians/physics4lm/fineweb_edu
    sources:
        fineweb_edu: 1.0
    
    batch_size: 128
    prefetch_size: 512
    seq_len: 2048
    n_views: 2
    enable_packing: false
    
    load_async: true
    seed: 42
    data_format: bin
    add_bos: false
    add_eos: false
    tokenizer:
        name: gpt2

# Profiling settings
profiling:
    run: false

# Checkpoint settings
checkpoint:
    dump:
        every: 10000 
        keep: 2
    eval:
        every: 10000
        keep: 2

eval:
  harness:
    tasks:
    - hellaswag
    - task: boolq
      dataset_kwargs:
        trust_remote_code: true
    - piqa
    - task: social_iqa
      dataset_kwargs:
        trust_remote_code: true
    - winogrande
    - openbookqa
    - arc_easy
    - arc_challenge
    - race
    - commonsense_qa
    - copa
    - task: lambada_openai
      dataset_kwargs:
        trust_remote_code: true
      metric_list:
      - metric: acc
        aggregation: mean
        higher_is_better: true
    - triviaqa
    log_samples: false
  validation: null
  generator:
    max_tokens: 2048
    dtype: bf16
    show_progress: true

# Logging settings
logging:
    freq: 10
    acc_freq: 10
    wandb:
        entity: kirill456z
        project: physics4llm
        name: "canon_text_{semver_tag}"
