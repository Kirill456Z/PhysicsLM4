# Mixed synthetic task training configuration
# All five tasks (Depo, Brevo, ConComp, ConCompFactor, ShortestPath) share a unified vocabulary:
#   - base_vocab_size=4 (tokens 1..8 for node words)
#   - min/max_token_length=4/6 (each node name = 4-6 tokens)
#   - Task-type token replaces BOS (first token of every sequence)
#   - vocab_size=512 covers all tokens with ample headroom
#
# See data_synthetic_pretrain/shared_vocab.py for the full token layout.

name: "mix_{semver_tag}"
dump_dir: /scratch/zemlians/physics4lm/mix_checkpoints

steps: 50000
probe_freq: null
seed: 63
grad_acc_steps: 1

# Optimizer settings
optim:
    lr: 6e-4
    warmup: 1000
    lr_min_ratio: 0.1
    weight_decay: 0.03
    epsilon: 1.0e-06
    beta1: 0.9
    beta2: 0.98

# Distributed training settings
distributed:
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

# Model architecture (GPT-2 Small: 117M params)
model:
    seed: 51
    dim: 512
    n_layers: 8
    n_heads: 8
    head_dim: 64
    # Unified vocab layout (B=4):
    #   0: PAD  1-4: base tokens  5-8: EOW markers
    #   9: TASK_DEPO  10: TASK_BREVO  11: TASK_CONCOMP  12: EOS
    #   13-14: Brevo specials  15-16: ConComp specials  17: DEPO_SEP
    #   201-216: Depo hop tokens (200+k, k=1..16)
    #   512 gives ample headroom for all current and future tokens.
    vocab_size: 512

    rope_theta: 10000.0
    canon_set: ""
    use_fast_conv1d:  true
    canon_kernel: 4
    canon_init: default
    train_canon_weights: true
    canon_gamma: false
    canon_residual: true
    z_loss: false

# Data loading settings
data:
    root_dir: /scratch/zemlians/physics4lm
    sources:
        depo: 1.0

    batch_size: 256
    prefetch_size: 1024
    seq_len: 1024
    n_views: 2
    n_workers: 8
    pad_token: 0
    no_train_label_token: -100

    load_async: true
    seed: 43

    tokenizer:
        name: none

    add_bos: false
    add_eos: false

synthetic_tasks_generation_args:
    synthetic_tasks:
        - task_name: "depo"
          generation_args:
            task_index: 100
            max_nodes: 75
            max_hops: 8
            num_queries: 8
            query_token_base: 200
            weight: 1.0
            graph_generator_config:
              base_vocab_size: 10
              min_token_length: 1
              max_token_length: 4
              is_directed: true
              is_dag: true
              edge_probability: 0.5
              encoding_config:
                pair_sep: 25
                node_to_neighbors_sep: 26
                format: edges_list

# Profiling settings
profiling:
    run: false

# Checkpoint settings
checkpoint:
    dump:
        every: 20000
        keep: 2
    eval:
        every: 5000000
        keep: 2

# Logging settings
logging:
    freq: 10
    acc_freq: 10
    diagnostics_easy_freq: 500
    diagnostics_medium_freq: 5000
    diagnostics_heavy_freq: 0
    wandb:
        entity: kirill456z
        project: physics4llm
        name: "mix_{semver_tag}"

eval:
  eval_dir: "scratch/zemlians/physics4lm/mixed_eval"
  max_examples: 100           # examples used for inference per bucket
  max_answer_size: 4          # buckets 0..4 only (dense graph rarely has smaller sets)
  num_examples_generate: 200  # examples to generate per bucket
  temperature: 0.0
  max_gen_len: 64
