# Experiment 6: Larger kernels — k=16
#
# Purpose: Pre-empt "did you try k=8?" by extending the kernel ablation
# (k∈{1,2,4,6} already done) to k=8 and k=16.
#
# Compare against: Llama (canon_text_0.1.130), ABCD k=4 (canon_text_0.1.129),
#                  k=6 (canon_text_0.1.148).
# Decision rule: if k=16 loss is within 0.001 of k=6 → saturation confirmed;
#                if k=16 further improves → keep going.
#
# Settings identical to k=6 run (canon_text_0.1.148): 8L/512D, ABCD,
# const_var_sqr init, 100k steps, text (FineWeb-Edu), bytes tokenizer.

name: "canon_text_{semver_tag}"
dump_dir: /scratch/zemlians/physics4lm/canon_text_checkpoints

steps: 100000
probe_freq: 1000
seed: 42

data_mode: text

grad_acc_steps: 1

optim:
    lr: 3e-4
    warmup: 1000
    lr_min_ratio: 0.1
    weight_decay: 0.03
    epsilon: 1.0e-06
    beta1: 0.9
    beta2: 0.98

distributed:
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

model:
    seed: 44
    dim: 512
    n_layers: 8
    n_heads: 8
    head_dim: 64
    vocab_size: -1

    rope_theta: 10000.0
    canon_set: "ABCD"
    use_fast_conv1d: false
    canon_kernel: 16
    canon_init: const_var_sqr

data:
    root_dir: /scratch/zemlians/physics4lm/fineweb_edu
    sources:
        fineweb_edu: 1.0

    batch_size: 128
    prefetch_size: 256
    seq_len: 2048
    n_views: 2
    enable_packing: false

    load_async: true
    seed: 42
    add_bos: true
    add_eos: true
    tokenizer:
        name: bytes

profiling:
    run: false

checkpoint:
    dump:
        every: 10000
        keep: 2
    eval:
        every: 10000
        keep: 2

eval:
  harness:
    tasks:
    - hellaswag
    - task: boolq
      dataset_kwargs:
        trust_remote_code: true
    - piqa
    - task: social_iqa
      dataset_kwargs:
        trust_remote_code: true
    - winogrande
    - openbookqa
    - arc_easy
    - arc_challenge
    - race
    - commonsense_qa
    - copa
    - task: lambada_openai
      dataset_kwargs:
        trust_remote_code: true
      metric_list:
      - metric: acc
        aggregation: mean
        higher_is_better: true
    - triviaqa
    log_samples: false
  validation: null
  generator:
    max_tokens: 2048
    dtype: bf16
    show_progress: true

logging:
    freq: 10
    acc_freq: 10
    wandb:
        entity: kirill456z
        project: physics4llm
        name: "canon_text_{semver_tag}"
